<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 英語学習プレイヤー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .input-group {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      background: #ff0000;
      color: #fff;
      border: none;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .subtitles {
      margin-top: 15px;
      padding: 15px;
      background: #1e1e1e;
      border-radius: 8px;
      text-align: center;
    }
    .en { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
    .ja { font-size: 1rem; color: #ffeb3b; }
  </style>
</head>
<body>

  <div class="container">
    <h2>YouTube 二重字幕プレイヤー</h2>
    
    <!-- 入力欄 -->
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="例: https://youtu.be/xxxx または ID">
      <button onclick="loadVideo()">再生</button>
    </div>

    <!-- YouTubeプレイヤーエリア -->
    <div class="video-wrapper">
      <div id="playerBox">
        <!-- 初期表示用（テスト動画） -->
        <iframe width="100%" height="100%" src="https://www.youtube.com/embed/M7lc1UVf-VE" allowfullscreen></iframe>
      </div>
    </div>

    <!-- 字幕表示エリア -->
    <div class="subtitles">
      <div class="en" id="enSub">ここに英語字幕が表示されます</div>
      <div class="ja" id="jaSub">ここに日本語訳が表示されます</div>
    </div>
  </div>

  <script>
    function loadVideo() {
      const input = document.getElementById('urlInput').value.trim();
      let videoId = "";

      if (!input) {
        alert("URLを入力してください。");
        return;
      }

      // 1. youtu.be/XXXX 形式のURLからIDを抽出
      if (input.includes('youtu.be/')) {
        videoId = input.split('youtu.be/')[1].split('?')[0];
      } 
      // 2. watch?v=XXXX 形式のURLからIDを抽出
      else if (input.includes('watch?v=')) {
        videoId = input.split('watch?v=')[1].split('&')[0];
      } 
      // 3. すでに embed/XXXX の場合
      else if (input.includes('embed/')) {
        videoId = input.split('embed/')[1].split('?')[0];
      }
      // 4. そのまま11桁の動画IDが入力された場合
      else {
        videoId = input;
      }

      if (videoId && videoId.length >= 10) {
        // 正しい embed URL に変換してiframeを再生成する
        const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        document.getElementById('playerBox').innerHTML = `<iframe width="100%" height="100%" src="${embedUrl}" allow="autoplay" allowfullscreen></iframe>`;
        
        document.getElementById('enSub').textContent = "動画を読み込みました";
        document.getElementById('jaSub').textContent = "（ここに英語・日本語の字幕を同期させます）";
      } else {
        alert("正しいYouTubeのURLまたは動画IDを入力してください。");
      }
    }
  </script>

</body>
</html>
